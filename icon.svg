<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- IONFALL icon: art/icon/background.svg + foreground.svg (tools/store_art.tscn renders the PNGs). -->

  <!-- IONFALL icon background: deep space with a planet horizon. -->
  <defs>
    <radialGradient id="bspace" cx="0.42" cy="0.38" r="0.8">
      <stop offset="0" stop-color="#16324a"/>
      <stop offset="0.6" stop-color="#0a1522"/>
      <stop offset="1" stop-color="#05090f"/>
    </radialGradient>
    <linearGradient id="bplanet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b8fb0"/>
      <stop offset="0.25" stop-color="#0d3a52"/>
      <stop offset="1" stop-color="#061420"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bspace)"/>
  <circle cx="512" cy="1900" r="1180" fill="url(#bplanet)"/>
  <circle cx="512" cy="1900" r="1180" fill="none" stroke="#4fe3ff" stroke-width="8" stroke-opacity="0.75"/>
  <circle cx="190" cy="180" r="5" fill="#ffffff" fill-opacity="0.7"/>
  <circle cx="820" cy="260" r="4" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="760" cy="120" r="3" fill="#ffffff" fill-opacity="0.5"/>
  <circle cx="140" cy="520" r="3" fill="#ffffff" fill-opacity="0.45"/>
  <circle cx="880" cy="520" r="4" fill="#ffffff" fill-opacity="0.5"/>

  <!-- IONFALL mark (PLAN §8): an ion streak falling onto an impact ring.
       Kept inside the central 66% so Android's adaptive masks never cut it. -->
  <defs>
    <linearGradient id="fstreak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fe3ff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#4fe3ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="fcore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#e8fbff"/>
      <stop offset="1" stop-color="#4fe3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- streak: tapered, from the upper left down to the impact -->
  <path d="M300 230 L590 610 L556 636 L284 246 Z" fill="url(#fstreak)"/>
  <path d="M352 236 L606 590 L594 600 L344 244 Z" fill="#ffffff" fill-opacity="0.35"/>
  <!-- impact: glow, core, ring -->
  <circle cx="600" cy="628" r="120" fill="url(#fcore)" fill-opacity="0.55"/>
  <circle cx="600" cy="628" r="46" fill="#ffffff"/>
  <ellipse cx="600" cy="640" rx="150" ry="44" fill="none" stroke="#4fe3ff" stroke-width="14" stroke-opacity="0.85"/>
  <ellipse cx="600" cy="640" rx="206" ry="62" fill="none" stroke="#4fe3ff" stroke-width="6" stroke-opacity="0.35"/>
</svg>
