name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "4.7.2-stable"
  # Pinned to Godot 4.7.2's Android template (platform/android/java/app/config.gradle).
  ANDROID_PLATFORM: "android-36"
  ANDROID_BUILD_TOOLS: "36.1.0"
  ANDROID_NDK: "29.0.14206865"
  BUNDLETOOL_VERSION: "1.18.3"

jobs:
  test-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write  # a v* tag drafts its GitHub release
    steps:
      # LFS objects come from a cache keyed on their IDs, so a run downloads
      # only new or changed files (GitHub's LFS bandwidth quota is small).
      - uses: actions/checkout@v7

      - name: List LFS objects
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-ids

      - name: Cache LFS objects
        uses: actions/cache@v6
        with:
          path: .git/lfs/objects
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-

      - name: Fetch LFS files
        run: git lfs pull

      # A v* tag is the release version (v0.9.2 → 0.9.2, v1.0 → 1.0.0; a
      # suffix such as v1.0.0-rc2 makes a pre-release of 1.0.0), so a release
      # needs no version commit; other builds use project.godot's.
      - name: Version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
            if [[ "$V" == *-* ]]; then echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV"; V="${V%%-*}"; fi
            [[ "$V" =~ ^[0-9]+\.[0-9]+$ ]] && V="$V.0"
            if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::tag $GITHUB_REF_NAME isn't vMAJOR.MINOR[.PATCH]"; exit 1
            fi
            sed -i "s/^config\/version=\".*\"/config\/version=\"$V\"/" project.godot
          fi
          V="$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "Building version $V"

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_RELEASE }}-v1

      - name: Download and verify Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          B=https://github.com/godotengine/godot/releases/download/$GODOT_RELEASE
          mkdir -p ~/godot/dl && cd ~/godot/dl
          curl -fsSL -o SHA512-SUMS.txt $B/SHA512-SUMS.txt
          curl -fsSL -o editor.zip $B/Godot_v${GODOT_RELEASE}_linux.x86_64.zip
          curl -fsSL -o templates.tpz $B/Godot_v${GODOT_RELEASE}_export_templates.tpz
          echo "$(grep " Godot_v${GODOT_RELEASE}_linux.x86_64.zip$" SHA512-SUMS.txt | cut -d' ' -f1)  editor.zip" | sha512sum -c
          echo "$(grep " Godot_v${GODOT_RELEASE}_export_templates.tpz$" SHA512-SUMS.txt | cut -d' ' -f1)  templates.tpz" | sha512sum -c
          unzip -q editor.zip -d ~/godot
          TPL=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$TPL" && unzip -q templates.tpz -d tpl && mv tpl/templates/* "$TPL"/
          rm -rf ~/godot/dl

      - name: Put Godot on PATH
        run: |
          sudo ln -sf ~/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 /usr/local/bin/godot
          godot --version

      # Godot reads JAVA_HOME when it first creates its editor settings (import step).
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # The NDK is also the native extension's Android toolchain.
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "platforms;$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" "ndk;$ANDROID_NDK" >/dev/null
          curl -fsSL -o ~/bundletool.jar \
            https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar

      # The native extension (native/, PLAN §3.17) for Linux, Windows
      # (cross-compiled with mingw-w64) and Android (arm64, plus x86_64 for
      # the emulator build). Built before the import so Godot registers it:
      # the tests then run the native path, and the exports ship it. The web
      # keeps the GDScript path (export_presets.cfg excludes native/).
      - name: Install native build tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq scons g++-mingw-w64-x86-64-posix >/dev/null
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix

      - name: Cache godot-cpp
        uses: actions/cache@v6
        with:
          path: |
            native/godot-cpp
            native/.sconsign.dblite
          key: godot-cpp-${{ hashFiles('native/build.sh', 'native/SConstruct') }}
          restore-keys: godot-cpp-

      - name: Build the native extension
        run: bash native/build.sh linux windows android

      - name: Import project
        run: timeout 600 godot --headless --import

      - name: Layer check (simulation/presentation split)
        run: python3 tools/check_layers.py

      - name: Unit tests
        run: |
          set -o pipefail
          timeout 600 godot --headless -s addons/gut/gut_cmdln.gd -gconfig=.gutconfig.json -gexit 2>&1 | tee gut.log
          grep -q -- "---- All tests passed! ----" gut.log

      # Internet play (decision 0005) needs the EOS credentials file, which is
      # never committed. With the repository secrets set, client builds get it
      # and show online play; without them they're LAN-only.
      - name: EOS credentials from secrets
        env:
          EOS_PRODUCT_ID: ${{ secrets.EOS_PRODUCT_ID }}
          EOS_SANDBOX_ID: ${{ secrets.EOS_SANDBOX_ID }}
          EOS_DEPLOYMENT_ID: ${{ secrets.EOS_DEPLOYMENT_ID }}
          EOS_CLIENT_ID: ${{ secrets.EOS_CLIENT_ID }}
          EOS_CLIENT_SECRET: ${{ secrets.EOS_CLIENT_SECRET }}
        run: |
          if [ -z "$EOS_CLIENT_SECRET" ]; then echo "No EOS secrets: builds are LAN-only"; exit 0; fi
          umask 077
          printf '[eos]\nproduct_name="IONFALL"\nproduct_id="%s"\nsandbox_id="%s"\ndeployment_id="%s"\nclient_id="%s"\nclient_secret="%s"\n' \
            "$EOS_PRODUCT_ID" "$EOS_SANDBOX_ID" "$EOS_DEPLOYMENT_ID" "$EOS_CLIENT_ID" "$EOS_CLIENT_SECRET" > eos_credentials.cfg
          echo "EOS credentials written: online play enabled in client builds"

      - name: Export desktop and web builds
        env:
          IONFALL_BUILD_NUMBER: "0"
        run: |
          set -euo pipefail
          export_preset() {
            python3 tools/write_build_info.py --platform "$2" --arch "$3" --config "$4"
            mkdir -p "$(dirname "$5")"
            timeout 900 godot --headless --export-$4 "$1" "$5" 2>&1 | tee export.log
            if grep -q "ERROR" export.log; then echo "::error::export of $1 logged errors"; exit 1; fi
          }
          export_preset "Linux" linux x86_64 release build/linux/ionfall.x86_64
          export_preset "Windows" windows x86_64 release build/windows/IONFALL.exe
          export_preset "Web" web wasm32 release build/web/index.html
          # The desktop builds ship the native extension; the web build doesn't.
          test -f build/linux/libionfall_native.linux.template_release.x86_64.so
          test -f build/windows/libionfall_native.windows.template_release.x86_64.dll
          ! ls build/web | grep -q ionfall_native

      # Server builds aren't released any more; the exported game runs the
      # same server (--server), so every map and mode is still checked.
      - name: Smoke test the exported game as a server (every map and mode)
        run: |
          set -euo pipefail
          for map in station spire foundry; do
            for mode in ffa tdm ctf waves; do
              timeout 60 build/linux/ionfall.x86_64 --headless -- --server --map $map --mode $mode --no-discovery --smoke-test 2>&1 | tee smoke.log
              grep -q "native rewind on" smoke.log
            done
          done
          # The scripted fight gives the same events with and without it.
          timeout 300 build/linux/ionfall.x86_64 --headless -- --native-parity 2>&1 | tee parity.log
          grep -q "NATIVE_PARITY OK" parity.log

      # Release tags are signed with the Play upload key when its secrets are
      # set (ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_KEY_ALIAS,
      # ANDROID_UPLOAD_KEY_PASSWORD; docs/release/releasing.md), and also
      # give a universal APK for sideloading. Everything else is debug-signed.
      - name: Export Android and run 16 KB checks
        env:
          BUNDLETOOL: /home/runner/bundletool.jar
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          CONFIG=debug
          if [[ "$GITHUB_REF" == refs/tags/v* && -n "$KEYSTORE_BASE64" ]]; then
            CONFIG=release
            (umask 077; echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks")
            export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/upload.jks"
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$KEY_ALIAS"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$KEY_PASSWORD"
          fi
          python3 tools/write_build_info.py --platform android --arch arm64 --config $CONFIG
          mkdir -p build/android
          timeout 1800 godot --headless --install-android-build-template --export-$CONFIG "Android" build/android/ionfall.aab 2>&1 | tee export.log
          if grep -q "ERROR" export.log; then echo "::error::Android export logged errors"; exit 1; fi
          test -f build/android/ionfall.aab
          unzip -l build/android/ionfall.aab | grep -q "arm64-v8a/libionfall_native"
          bash tools/check_16kb.sh build/android/ionfall.aab
          if [ "$CONFIG" = release ]; then
            java -jar "$BUNDLETOOL" build-apks --bundle=build/android/ionfall.aab --output="$RUNNER_TEMP/universal.apks" \
              --mode=universal --ks="$RUNNER_TEMP/upload.jks" --ks-key-alias="$KEY_ALIAS" \
              --ks-pass="pass:$KEY_PASSWORD" --key-pass="pass:$KEY_PASSWORD"
            unzip -q -o "$RUNNER_TEMP/universal.apks" universal.apk -d build/android
            rm -f "$RUNNER_TEMP/upload.jks"
          fi
          echo "ANDROID_CONFIG=$CONFIG" >> "$GITHUB_ENV"

      # A v* tag drafts its GitHub release with every download (release assets
      # don't count against the Actions storage quota). Publishing the draft
      # deploys its web build to GitHub Pages (pages.yml).
      - name: Draft the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/dist"
          mkdir -p "$D"
          for p in linux windows web; do
            (cd build/$p && zip -qr "$D/ionfall-$VERSION-$p.zip" .)
          done
          if [ "$ANDROID_CONFIG" = release ]; then
            cp build/android/universal.apk "$D/ionfall-$VERSION-android-arm64.apk"
            cp build/android/ionfall.aab "$D/ionfall-$VERSION.aab"
          else
            echo "::warning::No Android upload key secrets: the release has no APK or Play bundle"
          fi
          (cd "$D" && shopt -s nullglob && sha256sum ./*.zip ./*.apk > SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$D"/* --clobber
          else
            sed "s/{{VERSION}}/$VERSION/g" docs/release/notes-template.md > "$RUNNER_TEMP/notes.md"
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag ${PRERELEASE:-} --title "IONFALL $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" --generate-notes "$D"/*
          fi

      # Builds are ~280 MB and the free plan's Actions storage is 500 MB, so
      # they're uploaded only for manual runs (tags go to their release);
      # every push still builds and checks them.
      - name: Upload builds
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ionfall-${{ github.run_number }}
          path: build/
          retention-days: 3  # ~280 MB per run; 14 days hit the storage quota in M4
